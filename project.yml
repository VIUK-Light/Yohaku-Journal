name: Science Club Diary

options:
  minimumXcodeGenVersion: 2.45.0
  deploymentTarget:
    iOS: "18.1"
  createIntermediateGroups: true
  groupSortPosition: top

targets:
  Science Club Diary:
    type: application
    platform: iOS
    sources:
      - path: Diary
    info:
      path: Diary/Info.plist
      properties:
        CFBundleDisplayName: Science Club Diary
        LSApplicationCategoryType: public.app-category.lifestyle
        NSFaceIDUsageDescription: 日記の記録を開くためにFace IDを使用します。
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations: {}
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: org.viuk-light.yohaku-journal.backup
            UTTypeDescription: Yohaku Journal 暗号化バックアップ
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - yohakubackup
              public.mime-type:
                - application/vnd.viuk-light.yohaku-journal.backup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: viuk.scienceclub.diary
        DEVELOPMENT_TEAM: 34CN68272C
        GENERATE_INFOPLIST_FILE: false
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_LAUNCH_SCREEN: true
        SUPPORTS_MACCATALYST: true
        # MacではiPad互換版ではなく、Mac Catalyst版を起動する。
        # iPad実機・iPadシミュレータ向けの対応はTARGETED_DEVICE_FAMILYで維持する。
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: false
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"

  Science Club DiaryTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.1"
    sources:
      - path: Tests/ScienceClubDiaryTests
    dependencies:
      - target: Science Club Diary
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: viuk.scienceclub.diary.tests
        GENERATE_INFOPLIST_FILE: true

schemes:
  Science Club Diary:
    build:
      targets:
        Science Club Diary: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - Science Club DiaryTests
    archive:
      config: Release
